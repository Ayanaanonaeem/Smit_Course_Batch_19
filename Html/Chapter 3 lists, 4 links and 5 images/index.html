<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Lists</title>
	</head>
	<body>
		<!-- Ordered list -->

		<ol type="i">
			<li>Pizza</li>
			<li>Burger</li>
			<li>Bun kabab</li>
			<li>Biryani</li>
		</ol>

		<!-- unordered lists  -->
		<ul type="Square">
			<li>Pizza</li>
			<li>Burger</li>
			<li>Broast</li>
			<li>Tikka</li>
		</ul>

		<!-- definition list  -->
		<dl>
			<dt>Noun:</dt>
			<dd>A noun is name of person,name,place,animal,things</dd>
		</dl>

		<!-- Nested lists  -->
		<ul>
			<li>
				Pizzza
				<ol>
					<li>Fajita</li>
					<li>Tikka</li>
					<li>BBq</li>
				</ol>
			</li>

			<li>
				Burger
				<ul>
					<li>Cheese burger</li>
					<li>Beef burger</li>
					<li>Chicken burger</li>
				</ul>
			</li>
		</ul>
	</body>
</html>
